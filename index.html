<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shim Calc">
<meta name="color-scheme" content="light dark">
<title>Valve Shim Calculator</title>
<style>
:root{--bg:#e9ecef;--card:#fff;--ink:#1d252c;--mute:#66727d;--line:#cfd5db;--brass:#9a7326;--brassbg:#f3e8cf;--ok:#2c7a4b;--okbg:#dcefe3;--warn:#b5651d;--inp:#fff8d6}
@media(prefers-color-scheme:dark){:root{--bg:#1c2125;--card:#272e34;--ink:#e8ecef;--mute:#9aa6b0;--line:#3a444c;--brass:#d4aa5e;--brassbg:#3a3322;--ok:#6cc08b;--okbg:#22382b;--warn:#f0a15a;--inp:#3a3820}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
h1{font-size:26px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
p.m,.m{color:var(--mute);margin:4px 0 12px;font-size:14px}
a{color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.back,.chip{text-decoration:none;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:8px 14px}
.seg button.on{background:var(--brass);color:var(--card)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:4px}
.tabs a{flex:none;min-width:44px;text-align:center;text-decoration:none;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.tabs a.on{background:var(--brass);border-color:var(--brass);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.tile{display:flex;align-items:center;justify-content:space-between;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:14px;padding:18px 16px;margin:0 0 10px;font-size:19px;font-weight:700}
.tile small{display:block;font-weight:400;font-size:14px;color:var(--mute)}
.dots{display:flex;gap:5px}.dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--brass)}
.f{display:block;margin:0 0 10px}.f span{display:block;font-size:14px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
select,input[type=file],#nm{background:var(--card)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.valve{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.disc{width:92px;height:92px;border-radius:50%;border:6px solid var(--brass);background:var(--brassbg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;text-align:center}
.disc b{font-size:20px;line-height:1.1}.disc i{font-style:normal;font-size:12px;color:var(--mute)}
.disc.ok{border-color:var(--ok);background:var(--okbg)}
.note{font-size:14px;color:var(--mute);margin-top:8px;min-height:20px}
.w{color:var(--warn);font-weight:600}.good{color:var(--ok);font-weight:600}
button.pri,.row button{font:inherit;font-weight:600;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--brass);border-color:var(--brass);color:var(--card);width:100%}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.next{display:block;text-align:center;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;background:var(--brass);color:var(--card);margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const LAYOUTS={i4:{name:'Inline 4',n:4},i3:{name:'Inline 3',n:3},i2:{name:'Inline 2',n:2},v2:{name:'V-twin',n:2}};
const KEY='shimcalc.current',SK='shimcalc.saves',IN=25.4;
const app=document.getElementById('app');
const fresh=()=>({layout:null,unit:'mm',spec:{},cnt:{i:2,e:2},cyl:{},label:''});
let S=(()=>{try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)))}catch(e){return fresh()}})();
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const getSaves=()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}};
const putSaves=o=>{try{localStorage.setItem(SK,JSON.stringify(o))}catch(e){alert('Could not save in this browser. Use Download instead.')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMM=v=>S.unit==='in'?v*IN:v, fromMM=v=>S.unit==='in'?v/IN:v;
const fmt=x=>String(parseFloat(x.toFixed(S.unit==='in'?4:3)));
const show=mm=>mm==null?'':fmt(fromMM(mm));
const parse=x=>{const s=String(x).replace(',','.').trim();return(!s||isNaN(+s))?null:toMM(+s)};

function gv(c,t,i){S.cyl[c]=S.cyl[c]||{i:[],e:[]};const a=S.cyl[c][t];while(a.length<=i)a.push({m:null,s:null});return a[i]}

// NEW SHIM = CURRENT SHIM + (MEASURED CLEARANCE - TARGET CLEARANCE); all values held in mm
function calc(c,t,i){
  const v=gv(c,t,i),mn=S.spec[t+'min'],mx=S.spec[t+'max'];
  if(mn==null&&mx==null)return{err:'Set the clearance spec on the Specs tab.'};
  if(v.m==null||v.s==null)return{};
  const lo=mn??mx,hi=mx??mn,tg=(lo+hi)/2,nw=v.s+(v.m-tg);
  return{nw,tg,d:nw-v.s,ok:lo!==hi&&v.m>=Math.min(lo,hi)-1e-9&&v.m<=Math.max(lo,hi)+1e-9};
}
function out(c,t,i){
  const r=calc(c,t,i),v=gv(c,t,i),u=S.unit;
  if(r.err)return{d:'<b>—</b>',n:`<span class="w">${r.err}</span>`,ok:false};
  if(r.nw==null)return{d:'<b>—</b>',n:'Enter both values.',ok:false};
  const w=[];
  if(v.m<0.03||v.m>1.2)w.push(`Clearance of ${show(v.m)} ${u} is unusual. Check units.`);
  if(r.nw<1||r.nw>4.5)w.push('Result is outside typical 1.0–4.5 mm shim sizes. Recheck readings.');
  const sign=r.d>=0?'+':'−';
  let n=`${sign}${fmt(Math.abs(fromMM(r.d)))} ${u} vs current · target ${fmt(fromMM(r.tg))} ${u}`;
  if(r.ok)n+=`<br><span class="good">Within spec. No change needed.</span>`;
  if(w.length)n+=`<br><span class="w">${w.join('<br>')}</span>`;
  return{d:`<b>${fmt(fromMM(r.nw))}</b><i>${u} new shim</i>`,n,ok:r.ok};
}
function refresh(c,t,i){
  const o=out(c,t,i),d=document.getElementById(`d-${c}-${t}-${i}`),n=document.getElementById(`n-${c}-${t}-${i}`);
  if(!d)return;d.innerHTML=o.d;d.className='disc'+(o.ok?' ok':'');n.innerHTML=o.n;
}

const fld=(label,attrs,val)=>`<label class="f"><span>${label}</span><input inputmode="decimal" autocomplete="off" placeholder="${S.unit}" ${attrs} value="${val}"></label>`;
const tabs=a=>{const n=LAYOUTS[S.layout].n;let h=`<nav class="tabs"><a href="#L/${S.layout}" class="${a===0?'on':''}">Specs</a>`;
  for(let c=1;c<=n;c++)h+=`<a href="#L/${S.layout}/${c}" class="${a===c?'on':''}">Cyl ${c}</a>`;return h+'</nav>'};
const bar=()=>`<div class="bar"><a class="back" href="#">‹ Home</a><div class="seg"><button data-u="mm" class="${S.unit==='mm'?'on':''}">mm</button><button data-u="in" class="${S.unit==='in'?'on':''}">in</button></div><a class="chip" href="#saves">Saves</a></div>`;

function homePage(){
  const cont=S.layout?`<a class="tile" href="#L/${S.layout}">Continue ${LAYOUTS[S.layout].name}<small>${esc(S.label||'Unsaved job')}</small></a>`:'';
  return `<h1>Valve shim calculator</h1><p class="m">Pick the engine layout.</p>${cont}`+
    Object.entries(LAYOUTS).map(([k,L])=>`<a class="tile" href="#L/${k}"><span>${L.name}<small>${L.n} cylinders</small></span><span class="dots">${'<i></i>'.repeat(L.n)}</span></a>`).join('')+
    `<a class="tile" href="#saves"><span>Saved jobs<small>${Object.keys(getSaves()).length} saved on this phone</small></span></a>`;
}
function specPage(){
  const L=LAYOUTS[S.layout];
  const sec=(t,name)=>`<section class="card"><h2>${name}</h2>
    <label class="f"><span>Valves per cylinder</span><select data-cnt="${t}">${[1,2,3].map(n=>`<option ${S.cnt[t]===n?'selected':''}>${n}</option>`).join('')}</select></label>
    <div class="g2">${fld(`Spec min (${S.unit})`,`data-a="spec" data-f="${t}min"`,show(S.spec[t+'min']))}${fld(`Spec max (${S.unit})`,`data-a="spec" data-f="${t}max"`,show(S.spec[t+'max']))}</div></section>`;
  return tabs(0)+`<h1>${L.name} specs</h1><p class="m">Enter the clearance range from your service manual. The target is the midpoint. If the manual gives one number, enter it in both boxes.</p>`+sec('i','Intake')+sec('e','Exhaust')+
    `<a class="next" href="#L/${S.layout}/1">Start Cylinder 1</a>`;
}
function cylPage(c){
  const L=LAYOUTS[S.layout];let h=tabs(c)+`<h1>Cylinder ${c}</h1><p class="m">Measure the removed shim with a micrometer. Don't trust the stamped number.</p>`;
  for(const t of['i','e']){
    h+=`<section class="card"><h2>${t==='i'?'Intake':'Exhaust'}</h2>`;
    for(let i=0;i<S.cnt[t];i++){
      const v=gv(c,t,i),o=out(c,t,i),id=`${c}-${t}-${i}`;
      h+=`${i?'<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">':''}<div class="m" style="margin:0 0 6px"><b>${t==='i'?'Intake':'Exhaust'} ${i+1}</b></div>
      <div class="valve"><div>${fld(`Measured clearance (${S.unit})`,`data-a="v" data-c="${c}" data-t="${t}" data-i="${i}" data-f="m"`,show(v.m))}
      ${fld(`Shim removed (${S.unit})`,`data-a="v" data-c="${c}" data-t="${t}" data-i="${i}" data-f="s"`,show(v.s))}</div>
      <div class="disc${o.ok?' ok':''}" id="d-${id}">${o.d}</div></div><div class="note" id="n-${id}">${o.n}</div>`;
    }
    h+='</section>';
  }
  return h+(c<L.n?`<a class="next" href="#L/${S.layout}/${c+1}">Next: Cylinder ${c+1}</a>`:`<a class="next" href="#saves">Save this job</a>`);
}
function savesPage(){
  const sv=getSaves(),names=Object.keys(sv).sort();
  return `<h1>Saved jobs</h1><p class="m">Saved on this phone in this browser. Download a file as a backup.</p>
  <section class="card"><label class="f"><span>Name this job</span><input id="nm" placeholder="e.g. Ninja 650, March 2026" value="${esc(S.label||'')}"></label>
  <button class="pri" data-act="save" ${S.layout?'':'disabled'}>Save current job</button>${S.layout?'':'<p class="m">Open an engine layout first.</p>'}</section>`+
  (names.map(n=>`<section class="card"><b>${esc(n)}</b><p class="m">${LAYOUTS[sv[n].layout]?LAYOUTS[sv[n].layout].name:''}</p><div class="row"><button data-act="load" data-n="${esc(n)}">Open</button><button data-act="dl" data-n="${esc(n)}">Download</button><button data-act="del" data-n="${esc(n)}">Delete</button></div></section>`).join('')||'<p class="m">Nothing saved yet.</p>')+
  `<section class="card"><label class="f"><span>Import a downloaded file</span><input type="file" id="imp" accept=".json,application/json"></label></section>`;
}

function render(keep){
  const p=(location.hash.slice(1)||'').split('/');let body;
  if(p[0]==='saves')body=savesPage();
  else if(p[0]==='L'&&LAYOUTS[p[1]]){
    if(S.layout!==p[1]){S=Object.assign(fresh(),{unit:S.unit,layout:p[1]});store()}
    const c=+p[2];body=(c>=1&&c<=LAYOUTS[p[1]].n)?cylPage(c):specPage();
  }else body=homePage();
  app.innerHTML=bar()+body;
  if(!keep)window.scrollTo(0,0);
}

addEventListener('hashchange',()=>render());
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.a;if(!a)return;
  const val=parse(t.value);
  if(a==='spec')S.spec[t.dataset.f]=val;
  else{const c=+t.dataset.c,k=t.dataset.t,i=+t.dataset.i;gv(c,k,i)[t.dataset.f]=val;refresh(c,k,i)}
  store();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cnt){S.cnt[t.dataset.cnt]=+t.value;store()}
  if(t.id==='imp'&&t.files[0]){
    const f=t.files[0],r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result),sv=getSaves();
      if(o.layout&&LAYOUTS[o.layout])sv[f.name.replace(/\.json$/i,'')]=o;
      else Object.entries(o).forEach(([k,v])=>{if(v&&LAYOUTS[v.layout])sv[k]=v});
      putSaves(sv);render(true);
    }catch(err){alert('That file could not be read.')}};
    r.readAsText(f);
  }
});
document.addEventListener('click',e=>{
  const u=e.target.closest('[data-u]');
  if(u){S.unit=u.dataset.u;store();render(true);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,n=b.dataset.n,sv=getSaves();
  if(act==='save'){
    const name=document.getElementById('nm').value.trim()||`${LAYOUTS[S.layout].name} ${new Date().toISOString().slice(0,10)}`;
    if(sv[name]&&!confirm(`Replace the saved job "${name}"?`))return;
    S.label=name;sv[name]=JSON.parse(JSON.stringify(S));putSaves(sv);store();render(true);
  }else if(act==='load'){
    S=Object.assign(fresh(),sv[n],{unit:S.unit,label:n});store();location.hash='L/'+S.layout;
  }else if(act==='del'){
    if(confirm(`Delete "${n}"?`)){delete sv[n];putSaves(sv);render(true)}
  }else if(act==='dl'){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(sv[n],null,1)],{type:'application/json'}));
    a.download=n.replace(/[^\w\- ]+/g,'_')+'.json';document.body.appendChild(a);a.click();a.remove();
  }
});
render();
</script>
</body>
</html>
